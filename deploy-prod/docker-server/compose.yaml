services:
  relay:
    build:
      context: ../..
      dockerfile: deploy-prod/docker-server/Dockerfile.relay
      args:
        BIN_ARCH: ${BIN_ARCH:-amd64}
    image: snet-relay:local
    container_name: snet-relay
    restart: unless-stopped
    environment:
      SNET_RELAY_SECRET: ${SNET_RELAY_SECRET:?set SNET_RELAY_SECRET in deploy-prod/docker-server/.env}
    command:
      - "-addr"
      - "0.0.0.0:8092"
      - "-metrics-addr"
      - "127.0.0.1:8094"
    ports:
      - "8092:8092/udp"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8094/healthz >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  server:
    build:
      context: ../..
      dockerfile: deploy-prod/docker-server/Dockerfile.snetserv
      args:
        BIN_ARCH: ${BIN_ARCH:-amd64}
    image: snet-snetserv:local
    container_name: snet-server
    restart: unless-stopped
    depends_on:
      relay:
        condition: service_healthy
    environment:
      SNET_RELAY_SECRET: ${SNET_RELAY_SECRET:?set SNET_RELAY_SECRET in deploy-prod/docker-server/.env}
      SNET_RELAY_V2_ENDPOINTS: ${SNET_RELAY_V2_ENDPOINTS:-snet.uizhi.eu.org:8092}
      SNET_HUB_NODE_ID: ${SNET_HUB_NODE_ID:-}
      SNET_HUB_PUBLIC_KEY: ${SNET_HUB_PUBLIC_KEY:-}
      SNET_HUB_ENDPOINT: ${SNET_HUB_ENDPOINT:-}
      SNET_INTERNAL_ADMIN_TOKEN: ${SNET_INTERNAL_ADMIN_TOKEN:?set SNET_INTERNAL_ADMIN_TOKEN in deploy-prod/docker-server/.env}
    command:
      - "-addr"
      - "0.0.0.0:8090"
      - "-probe-addr"
      - "0.0.0.0:8091"
      - "-db"
      - "/data/snet.db"
      - "-public-url"
      - "${SNETSERV_PUBLIC_URL:-https://snet.uizhi.eu.org:8090}"
      - "-internal-addr"
      - "0.0.0.0:8096"
      - "-internal-token"
      - "${SNET_INTERNAL_ADMIN_TOKEN:?set SNET_INTERNAL_ADMIN_TOKEN in deploy-prod/docker-server/.env}"
      - "-internal-allow-cidr"
      - "${SNET_INTERNAL_ADMIN_ALLOW_CIDR:-172.16.0.0/12}"
      - "-tls-cert"
      - "${TLS_CERT_PATH:-/etc/letsencrypt/live/snet.uizhi.eu.org/fullchain.pem}"
      - "-tls-key"
      - "${TLS_KEY_PATH:-/etc/letsencrypt/live/snet.uizhi.eu.org/privkey.pem}"
    ports:
      - "8090:8090/tcp"
      - "8091:8091/udp"
      # Host-loopback only: used by `curl`/admin tooling on the VPS itself.
      - "127.0.0.1:8096:8096/tcp"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - snet-data:/data

  admin-server:
    build:
      context: ../..
      dockerfile: deploy-prod/docker-server/Dockerfile.admin-server
      args:
        BIN_ARCH: ${BIN_ARCH:-amd64}
    image: snet-admin-server:local
    container_name: snet-admin-server
    restart: unless-stopped
    depends_on:
      - server
    environment:
      SNET_INTERNAL_ADMIN_TOKEN: ${SNET_INTERNAL_ADMIN_TOKEN:?set SNET_INTERNAL_ADMIN_TOKEN in deploy-prod/docker-server/.env}
      SNET_ADMIN_USER: ${SNET_ADMIN_USER:?set SNET_ADMIN_USER in deploy-prod/docker-server/.env}
      SNET_ADMIN_PASSWORD: ${SNET_ADMIN_PASSWORD:?set SNET_ADMIN_PASSWORD in deploy-prod/docker-server/.env}
    command:
      - "-addr"
      - "0.0.0.0:8095"
      - "-snet-server"
      - "http://snet-server:8096"
      - "-tls-cert"
      - "${TLS_CERT_PATH:-/etc/letsencrypt/live/snet.uizhi.eu.org/fullchain.pem}"
      - "-tls-key"
      - "${TLS_KEY_PATH:-/etc/letsencrypt/live/snet.uizhi.eu.org/privkey.pem}"
    ports:
      - "127.0.0.1:8095:8095/tcp"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro

volumes:
  snet-data:
