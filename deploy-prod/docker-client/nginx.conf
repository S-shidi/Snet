server {
    listen 8080;
    server_name _;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location /ctl/ {
        proxy_pass http://127.0.0.1:19432;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Injected from /etc/snet/ctl-token by nginx-entrypoint.sh.
        proxy_set_header X-Ctl-Token "__CTL_TOKEN__";
        # Mark request as web-proxied; daemon requires a valid web session.
        proxy_set_header X-Snet-Web "1";
        proxy_set_header Authorization $http_authorization;
    }
}
