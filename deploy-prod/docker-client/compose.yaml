services:
  snet:
    # Combined image: snetd + nginx + shared/web, supervised by supervisord.
    # Pin a release with SNET_IMAGE=ghcr.io/s-shidi/snet-client:vX.Y.Z
    image: ${SNET_IMAGE:-ghcr.io/s-shidi/snet-client:latest}
    container_name: snetd
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./data:/etc/snet
