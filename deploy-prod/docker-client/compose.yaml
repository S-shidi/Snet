services:
  snetd:
    # Registry image (HTTP + basic auth). Run docker login 66.187.6.46:5000 -u snet first.
    # Requires insecure-registries for 66.187.6.46:5000; offline tar fallback in README.
    image: 66.187.6.46:5000/snet-client:latest
    container_name: snetd
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - /etc/snet:/etc/snet
    command:
      - "-config"
      - "/etc/snet/config.json"
      - "-ctl"
      - "127.0.0.1:19432"
      - "-device-id-file"
      - "/etc/snet/device.id"
