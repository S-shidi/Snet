services:
  snetd:
    # Combined image: snetd + nginx + shared/web, supervised by supervisord.
    image: 66.187.6.46:5000/snet-client:latest
    container_name: snetd
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - /etc/snet:/etc/snet
