<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Snet · Web 控制台</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div id="toast-wrap"></div>
<div id="modal-root" hidden></div>

<!-- ════════════════════════════════════════════════════════════════ -->
<!-- Standalone pages — only one visible at a time                  -->
<!-- ════════════════════════════════════════════════════════════════ -->

<!-- Step 1: Setup password -->
<div id="setup-page" class="standalone-page" hidden>
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">
        <svg viewBox="0 0 24 24" fill="#fff" width="28" height="28"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path opacity=".9" d="m2 12 10 5 10-5-2.2-1.1L12 14.7 4.2 10.9 2 12Z"/><path opacity=".75" d="m2 17 10 5 10-5-2.2-1.1L12 19.7 4.2 15.9 2 17Z"/></svg>
      </div>
      <h1 class="auth-title">Snet</h1>
      <p class="auth-subtitle">虚拟组网 · Web 控制台</p>
    </div>
    <div class="auth-steps">
      <div class="step done"><span class="step-num">1</span> 设置密码</div>
      <div class="step-line"></div>
      <div class="step"><span class="step-num">2</span> 绑定服务器</div>
    </div>
    <form id="setup-form" class="auth-form" autocomplete="off">
      <p class="auth-desc">首次使用，请设置管理密码</p>
      <div class="field">
        <label>新密码</label>
        <div class="input-wrap">
          <input id="setup-password" type="password" placeholder="至少 8 个字符" autocomplete="new-password" autofocus />
          <button type="button" class="toggle-pw" data-target="setup-password" tabindex="-1">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div class="field">
        <label>确认密码</label>
        <div class="input-wrap">
          <input id="setup-password2" type="password" placeholder="再次输入" autocomplete="new-password" />
          <button type="button" class="toggle-pw" data-target="setup-password2" tabindex="-1">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <p class="msg" id="setup-result"></p>
      <button id="setup-submit" type="submit" class="btn-full">设置密码并继续</button>
    </form>
  </div>
</div>

<!-- Login page -->
<div id="login-page" class="standalone-page" hidden>
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">
        <svg viewBox="0 0 24 24" fill="#fff" width="28" height="28"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path opacity=".9" d="m2 12 10 5 10-5-2.2-1.1L12 14.7 4.2 10.9 2 12Z"/><path opacity=".75" d="m2 17 10 5 10-5-2.2-1.1L12 19.7 4.2 15.9 2 17Z"/></svg>
      </div>
      <h1 class="auth-title">Snet</h1>
      <p class="auth-subtitle">虚拟组网 · Web 控制台</p>
    </div>
    <form id="login-form" class="auth-form" autocomplete="off">
      <div class="field">
        <label>管理密码</label>
        <div class="input-wrap">
          <input id="login-password" type="password" placeholder="请输入密码" autocomplete="current-password" autofocus />
          <button type="button" class="toggle-pw" data-target="login-password" tabindex="-1">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div class="field check-row">
        <label><input id="login-remember" type="checkbox" checked /> 记住登录（30 天）</label>
      </div>
      <p class="msg" id="login-result"></p>
      <button id="login-submit" type="submit" class="btn-full">登录</button>
    </form>
    <p class="auth-footer">Snet 虚拟组网控制台</p>
  </div>
</div>

<!-- ════════════════════════════════════════════════════════════════ -->
<!-- Main app                                                       -->
<!-- ════════════════════════════════════════════════════════════════ -->
<div id="app" hidden>
  <header>
    <div class="header-inner">
      <div class="brand">
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path opacity=".9" d="m2 12 10 5 10-5-2.2-1.1L12 14.7 4.2 10.9 2 12Z"/><path opacity=".75" d="m2 17 10 5 10-5-2.2-1.1L12 19.7 4.2 15.9 2 17Z"/></svg>
        </div>
        <div>
          <h1>Snet</h1>
          <span class="sub">虚拟组网 · 客户端 <span class="ver-pill" id="app-version" hidden></span></span>
        </div>
      </div>
      <div class="header-right">
        <span class="live-dot ok" id="daemon-state">snetd</span>
        <button class="btn ghost sm" id="header-svc-btn" hidden>启动</button>
        <div class="header-actions" id="header-actions">
          <button class="btn icon" id="btn-refresh" title="刷新" aria-label="刷新">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="17" height="17"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
          </button>
          <button class="btn icon" id="btn-info" title="设置" aria-label="设置">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" width="17" height="17"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
          <button class="btn icon" id="btn-logout" title="退出" aria-label="退出">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="17" height="17"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          </button>
        </div>
        <div class="header-more" id="header-more" hidden>
          <button class="btn icon" id="btn-more" title="更多" aria-label="更多">
            <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
          </button>
          <div class="header-dropdown" id="header-dropdown" hidden>
            <button class="dropdown-item" data-action="refresh">刷新</button>
            <button class="dropdown-item" data-action="info">设置</button>
            <button class="dropdown-item" data-action="logout">退出</button>
          </div>
        </div>
      </div>
    </div>
    <nav class="network-tabs" id="network-tabs" aria-label="网络切换"></nav>
  </header>

  <div id="empty-state" class="empty-state" hidden>
    <div class="empty-state-inner">
      <div class="empty-state-icon">
        <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="32" r="9"/><circle cx="48" cy="32" r="9"/><path d="M25 32h14"/><path d="M32 8v10M32 46v10M8 32H2M62 32h-6"/></svg>
      </div>
      <h2>还没有虚拟网络</h2>
      <p>您目前还没有加入任何虚拟网络，创建一个或输入邀请码加入吧。</p>
      <p class="hint empty-device-id">设备 ID <code id="empty-device-id">-</code></p>
      <div class="empty-state-actions">
        <button class="btn big" id="empty-create">
          <span class="big-icon">+</span> 创建新网络
        </button>
        <button class="btn big ghost" id="empty-join">
          <span class="big-icon">→</span> 加入现有网络
        </button>
      </div>
    </div>
  </div>

  <div id="app-main">
    <div id="panel-networks" class="tab-panel active">
      <div id="net-detail" class="net-detail" hidden></div>
    </div>

    <div id="status-source" hidden>
      <div class="status-grid">
        <div class="stat"><div class="label">设备ID</div><div class="value" id="device-id">-</div></div>
        <div class="stat"><div class="label">WireGuard 端口</div><div class="value" id="svc-wgport">-</div></div>
        <div class="stat"><div class="label">NAT 类型</div><div class="value" id="svc-nat">-</div></div>
      </div>
      <div class="card">
        <div class="card-head"><h3>原始状态 JSON</h3></div>
        <pre id="status-json" class="json"></pre>
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
