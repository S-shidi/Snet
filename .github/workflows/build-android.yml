name: Build Android App

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android NDK and build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_PATH"

      - name: Install gomobile
        shell: bash
        run: |
          set -euo pipefail
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/gomobile" init

      - name: Build gomobile AAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app-native/app/libs
          gomobile bind \
            -target=android/arm64 \
            -androidapi 26 \
            -javapkg=com.snet.android \
            -o android/app-native/app/libs/snet.aar \
            ./snetbind

      - name: Build WebView assets
        shell: bash
        run: ./scripts/build-android-web.sh

      - name: Get version
        id: vars
        shell: bash
        run: echo "VERSION=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build APKs
        shell: bash
        working-directory: android/app-native
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk              "../Snet-v${{ steps.vars.outputs.VERSION }}-android-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk              "../Snet-v${{ steps.vars.outputs.VERSION }}-android-debug.apk"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Snet-Android-v${{ steps.vars.outputs.VERSION }}
          path: |
            android/Snet-v${{ steps.vars.outputs.VERSION }}-android-release.apk
            android/Snet-v${{ steps.vars.outputs.VERSION }}-android-debug.apk
          retention-days: 14

      - name: Publish Android release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/Snet-v${{ steps.vars.outputs.VERSION }}-android-release.apk
            android/Snet-v${{ steps.vars.outputs.VERSION }}-android-debug.apk
          fail_on_unmatched_files: true
