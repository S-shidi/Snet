name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: |
            go.sum
            desktop-windows/go.sum
            desktop-mac-v3/go.sum

      - name: Go tests
        run: go test ./...

      - name: Go vet
        run: go vet ./...

      - name: Windows cross build
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: go build ./...

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build shared web UI
        run: ./desktop-windows/frontend/build-frontend.sh

      - name: TypeScript check
        working-directory: shared/web
        run: npx --yes -p typescript@5.9.3 tsc --noEmit -p tsconfig.json
