name: Build macOS App

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: |
            go.sum
            desktop-mac/go.sum
            desktop-mac-v3/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build snetd daemon
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          VERSION=$(cat VERSION)
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath \
            -ldflags="-s -w -X snet/internal/buildinfo.Version=${VERSION} -X snet/internal/buildinfo.Commit=${COMMIT} -X snet/internal/buildinfo.BuildDate=${BUILD_DATE}" \
            -o dist/snetd-darwin-arm64 ./cmd/client/snetd

      - name: Get Version Info
        id: vars
        run: |
          echo "VERSION=$(cat VERSION)" >> $GITHUB_OUTPUT
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build Frontend
        working-directory: ./desktop-mac-v3
        run: |
          set -euo pipefail
          ./frontend/build-frontend.sh

      - name: Build Wails Binary (No Bundle)
        working-directory: ./desktop-mac-v3
        run: |
          set -euo pipefail
          CGO_ENABLED=1 go build -tags desktop,production -trimpath -buildvcs=false \
            -ldflags "-w -s" -o SnetMac .

      - name: Manually Assemble .app Bundle
        working-directory: ./desktop-mac-v3
        run: |
          set -euo pipefail
          APP_DIR="build/SnetMac.app"
          rm -rf "$APP_DIR"
          mkdir -p "$APP_DIR/Contents/MacOS"
          mkdir -p "$APP_DIR/Contents/Resources"

          cp SnetMac "$APP_DIR/Contents/MacOS/SnetMac"
          chmod +x "$APP_DIR/Contents/MacOS/SnetMac"

          test -f ../dist/snetd-darwin-arm64
          test -f scripts/install-daemon.sh
          cp ../dist/snetd-darwin-arm64 "$APP_DIR/Contents/Resources/snetd"
          cp scripts/install-daemon.sh "$APP_DIR/Contents/Resources/install-daemon.sh"
          chmod +x "$APP_DIR/Contents/Resources/snetd" "$APP_DIR/Contents/Resources/install-daemon.sh"

          cat > "$APP_DIR/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>SnetMac</string>
              <key>CFBundleIdentifier</key>
              <string>com.snet.app</string>
              <key>CFBundleName</key>
              <string>SnetMac</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.11</string>
              <key>CFBundleVersion</key>
              <string>1.0.11</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.13</string>
              <key>LSUIElement</key>
              <true/>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

          echo "=== 检查 .app 结构 ==="
          find "$APP_DIR" -type f
          plutil -lint "$APP_DIR/Contents/Info.plist"

      - name: Manual Codesign (Clean Room)
        working-directory: ./desktop-mac-v3
        run: |
          set -euo pipefail
          APP_PATH="build/SnetMac.app"
          xattr -cr "$APP_PATH"

          codesign --force --sign - "$APP_PATH/Contents/Resources/snetd"
          codesign --verify --strict "$APP_PATH/Contents/Resources/snetd"

          codesign --force --sign - "$APP_PATH/Contents/MacOS/SnetMac"

          codesign --force --sign - "$APP_PATH"

          codesign --verify --deep --strict "$APP_PATH"
          codesign -dv --verbose=4 "$APP_PATH"

      - name: Create DMG
        working-directory: ./desktop-mac-v3/build
        run: |
          set -euo pipefail
          DMG_NAME="SnetMac-v${{ steps.vars.outputs.VERSION }}-${{ steps.vars.outputs.SHORT_SHA }}.dmg"
          STAGE="dmg-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -R SnetMac.app "$STAGE/"
          if ! command -v create-dmg >/dev/null 2>&1; then
            brew install create-dmg || true
          fi
          if ! command -v create-dmg >/dev/null 2>&1 || ! create-dmg \
            --volname "Snet Installer" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "SnetMac.app" 200 190 \
            --hide-extension "SnetMac.app" \
            --app-drop-link 600 185 \
            "$DMG_NAME" \
            "$STAGE"; then
            rm -f "$DMG_NAME"
            ln -sfn /Applications "$STAGE/Applications"
            hdiutil create -volname "Snet Installer" -srcfolder "$STAGE" -ov -format UDZO "$DMG_NAME"
          fi

      - name: Package Zip
        working-directory: ./desktop-mac-v3/build
        run: |
          set -euo pipefail
          ZIP_NAME="SnetMac-v${{ steps.vars.outputs.VERSION }}-${{ steps.vars.outputs.SHORT_SHA }}.zip"
          ditto -c -k --sequesterRsrc --keepParent SnetMac.app "$ZIP_NAME"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnetMac-v${{ steps.vars.outputs.VERSION }}-${{ steps.vars.outputs.SHORT_SHA }}
          path: |
            desktop-mac-v3/build/SnetMac-v*.zip
            desktop-mac-v3/build/SnetMac-v*.dmg
          retention-days: 7

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop-mac-v3/build/SnetMac-v*.zip
            desktop-mac-v3/build/SnetMac-v*.dmg
          generate_release_notes: true
