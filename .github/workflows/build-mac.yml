name: Build macOS App

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: |
            go.sum
            desktop-mac/go.sum
            desktop-mac-v3/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails v3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Build snetd daemon
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          VERSION=$(cat VERSION)
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath \
            -ldflags="-s -w -X snet/internal/buildinfo.Version=${VERSION} -X snet/internal/buildinfo.Commit=${COMMIT} -X snet/internal/buildinfo.BuildDate=${BUILD_DATE}" \
            -o dist/snetd-darwin-arm64 ./cmd/client/snetd

      - name: Get Version Info
        id: vars
        run: |
          echo "VERSION=$(cat VERSION)" >> $GITHUB_OUTPUT
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build App Bundle (No Sign)
        working-directory: ./desktop-mac-v3
        run: |
          set -euo pipefail
          export PATH=$PATH:$(go env GOPATH)/bin
          wails3 task darwin:build-only
          test -d bin/SnetMac.app
          test -f bin/SnetMac.app/Contents/Info.plist
          test -x bin/SnetMac.app/Contents/Resources/snetd
          test -f bin/SnetMac.app/Contents/Resources/install-daemon.sh

      - name: Clean xattrs
        working-directory: ./desktop-mac-v3
        run: |
          set -euo pipefail
          xattr -cr bin/SnetMac.app

      - name: Manual Codesign (Bottom-Up)
        working-directory: ./desktop-mac-v3
        run: |
          set -euo pipefail
          APP_PATH="bin/SnetMac.app"
          codesign --force --sign - "$APP_PATH/Contents/Resources/snetd"
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --strict --verbose=2 "$APP_PATH/Contents/Resources/snetd"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -dv --verbose=4 "$APP_PATH"

      - name: Create DMG
        working-directory: ./desktop-mac-v3/bin
        run: |
          set -euo pipefail
          DMG_NAME="SnetMac-v${{ steps.vars.outputs.VERSION }}-${{ steps.vars.outputs.SHORT_SHA }}.dmg"
          if ! command -v create-dmg >/dev/null 2>&1; then
            brew install create-dmg || true
          fi
          if ! command -v create-dmg >/dev/null 2>&1 || ! create-dmg \
            --volname "Snet Installer" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "SnetMac.app" 200 190 \
            --hide-extension "SnetMac.app" \
            --app-drop-link 600 185 \
            "$DMG_NAME" \
            "SnetMac.app"; then
            rm -f "$DMG_NAME"
            hdiutil create -volname "Snet Installer" -srcfolder SnetMac.app -ov -format UDZO "$DMG_NAME"
          fi
          codesign --verify --deep --strict --verbose=2 SnetMac.app

      - name: Package Zip
        working-directory: ./desktop-mac-v3/bin
        run: |
          set -euo pipefail
          ZIP_NAME="SnetMac-v${{ steps.vars.outputs.VERSION }}-${{ steps.vars.outputs.SHORT_SHA }}.zip"
          ditto -c -k --sequesterRsrc --keepParent SnetMac.app "$ZIP_NAME"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnetMac-v${{ steps.vars.outputs.VERSION }}-${{ steps.vars.outputs.SHORT_SHA }}
          path: |
            desktop-mac-v3/bin/SnetMac-v*.zip
            desktop-mac-v3/bin/SnetMac-v*.dmg
          retention-days: 7
