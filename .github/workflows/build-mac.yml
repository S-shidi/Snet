name: Build macOS App

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: |
            go.sum
            desktop-mac/go.sum
            desktop-mac-v3/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails v3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Build snetd daemon
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          VERSION=$(cat VERSION)
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath \
            -ldflags="-s -w -X snet/internal/buildinfo.Version=${VERSION} -X snet/internal/buildinfo.Commit=${COMMIT} -X snet/internal/buildinfo.BuildDate=${BUILD_DATE}" \
            -o dist/snetd-darwin-arm64 ./cmd/client/snetd

      - name: Get Version Info
        id: vars
        run: |
          echo "VERSION=$(cat VERSION)" >> $GITHUB_OUTPUT
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build Wails v3 App
        working-directory: ./desktop-mac-v3
        run: |
          set -euo pipefail
          export PATH=$PATH:$(go env GOPATH)/bin
          wails3 task darwin:package

      - name: Verify App Signature
        working-directory: ./desktop-mac-v3
        run: |
          set -euo pipefail
          codesign --verify --strict --verbose=2 bin/SnetMac.app/Contents/Resources/snetd
          codesign --verify --deep --strict --verbose=2 bin/SnetMac.app
          codesign --display --verbose=2 bin/SnetMac.app

      - name: Package DMG
        working-directory: ./desktop-mac-v3
        run: |
          set -euo pipefail
          export PATH=$PATH:$(go env GOPATH)/bin
          wails3 task darwin:create:dmg
          codesign --verify --deep --strict --verbose=2 bin/SnetMac.app

          cd bin
          ZIP_NAME="SnetMac-v${{ steps.vars.outputs.VERSION }}-${{ steps.vars.outputs.SHORT_SHA }}.zip"
          DMG_NAME="SnetMac-v${{ steps.vars.outputs.VERSION }}-${{ steps.vars.outputs.SHORT_SHA }}.dmg"
          ditto -c -k --sequesterRsrc --keepParent SnetMac.app "$ZIP_NAME"
          mv SnetMac.dmg "$DMG_NAME"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnetMac-v${{ steps.vars.outputs.VERSION }}-${{ steps.vars.outputs.SHORT_SHA }}
          path: |
            desktop-mac-v3/bin/SnetMac-v*.zip
            desktop-mac-v3/bin/SnetMac-v*.dmg
          retention-days: 7
