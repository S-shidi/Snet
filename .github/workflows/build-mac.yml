name: Build macOS App

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: |
            go.sum
            desktop-mac/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build snetd daemon
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          VERSION=$(cat VERSION)
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath \
            -ldflags="-s -w -X snet/internal/buildinfo.Version=${VERSION} -X snet/internal/buildinfo.Commit=${COMMIT} -X snet/internal/buildinfo.BuildDate=${BUILD_DATE}" \
            -o dist/snetd-darwin-arm64 ./cmd/client/snetd

      - name: Build Wails App
        working-directory: ./desktop-mac
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          ./frontend/build-frontend.sh
          wails build -platform darwin/arm64 -clean

      - name: Get Version Info
        id: vars
        run: |
          echo "VERSION=$(cat VERSION)" >> $GITHUB_OUTPUT
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Package App with Daemon
        run: |
          mkdir -p desktop-mac/build/bin/SnetMac.app/Contents/Resources/
          cp dist/snetd-darwin-arm64 desktop-mac/build/bin/SnetMac.app/Contents/Resources/snetd
          cp desktop-mac/scripts/install-daemon.sh desktop-mac/build/bin/SnetMac.app/Contents/Resources/install-daemon.sh
          chmod +x desktop-mac/build/bin/SnetMac.app/Contents/Resources/snetd
          chmod +x desktop-mac/build/bin/SnetMac.app/Contents/Resources/install-daemon.sh

          codesign --force --deep --sign - desktop-mac/build/bin/SnetMac.app

          cd desktop-mac/build/bin
          ZIP_NAME="SnetMac-v${{ steps.vars.outputs.VERSION }}-${{ steps.vars.outputs.SHORT_SHA }}.zip"
          zip -r "$ZIP_NAME" SnetMac.app

      - name: Create DMG
        run: |
          brew install create-dmg || true

          cd desktop-mac/build/bin
          create-dmg \
            --volname "Snet Installer" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "SnetMac.app" 200 190 \
            --hide-extension "SnetMac.app" \
            --app-drop-link 600 185 \
            "SnetMac-v${{ steps.vars.outputs.VERSION }}-${{ steps.vars.outputs.SHORT_SHA }}.dmg" \
            "SnetMac.app"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnetMac-v${{ steps.vars.outputs.VERSION }}-${{ steps.vars.outputs.SHORT_SHA }}
          path: |
            desktop-mac/build/bin/SnetMac-v*.zip
            desktop-mac/build/bin/SnetMac-v*.dmg
          retention-days: 7
