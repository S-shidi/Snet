name: Build WankeCloud firmware

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: |
            go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install e2fsprogs
        run: sudo apt-get update && sudo apt-get install -y e2fsprogs

      - name: Build WankeCloud repack
        run: ./scripts/hardware/build-wankecloud-repack.sh

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: Snet-wankecloud-v${{ github.run_id }}
          path: dist/hardware/wankecloud/*
          retention-days: 14
