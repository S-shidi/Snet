name: Build WankeCloud firmware

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    # Manual runs and stable tags only; prerelease tags skip platform assets.
    if: ${{ github.ref_type != 'tag' || !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches VERSION
        if: ${{ github.ref_type == 'tag' }}
        run: |
          set -euo pipefail
          want="${GITHUB_REF_NAME#v}"
          have="$(tr -d '[:space:]' < VERSION)"
          if [ "$want" != "$have" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match VERSION ${have}" >&2
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: |
            go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install e2fsprogs
        run: sudo apt-get update && sudo apt-get install -y e2fsprogs

      - name: Build WankeCloud repack
        run: ./scripts/hardware/build-wankecloud-repack.sh

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: Snet-wankecloud-v${{ github.run_id }}
          path: dist/hardware/wankecloud/*
          retention-days: 14

      - name: Upload firmware to release
        if: ${{ github.ref_type == 'tag' }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist/hardware/wankecloud/Snet-v*-wankecloud-s805.burn.img.xz
          fail_on_unmatched_files: true
